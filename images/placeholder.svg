<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
    <rect width="400" height="300" fill="#1a1f24" />
    <circle cx="200" cy="120" r="40" fill="none" stroke="#2ecc71" stroke-width="4" stroke-dasharray="10 5">
        <animateTransform attributeName="transform" type="rotate" from="0 200 120" to="360 200 120" dur="5s" repeatCount="indefinite" />
    </circle>
    <path d="M190 110 L210 110 L210 130 L190 130 Z" fill="#2ecc71">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite" />
    </path>
    <text x="200" y="200" font-family="'Inter', sans-serif" font-size="18" fill="#ecf0f1" text-anchor="middle" font-weight="500">Média en cours d'intégration</text>
    <text x="200" y="230" font-family="'Inter', sans-serif" font-size="14" fill="#2ecc71" text-anchor="middle" font-weight="400">Projet GhostBuster</text>
</svg>
